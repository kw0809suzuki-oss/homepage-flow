<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>月を飼う群れ</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070914;font-family:system-ui,sans-serif}body{touch-action:none}canvas{display:block;width:100%;height:100%}.ui{position:fixed;left:18px;top:16px;color:#dce6ff;pointer-events:none;text-shadow:0 1px 8px #000}.ui h1{font-size:18px;letter-spacing:.18em;margin:0 0 5px;font-weight:500}.ui p{font-size:12px;opacity:.7;margin:0}.hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;color:#aab8dc;opacity:.8;white-space:nowrap;pointer-events:none}.badge{position:fixed;right:16px;top:16px;border:1px solid #52638d;border-radius:20px;padding:6px 10px;font-size:11px;color:#b9c9f5;background:#10172a99}
</style>
</head>
<body>
<canvas id="c" aria-label="月を動かすと光の群れが反応します"></canvas>
<div class="ui"><h1>月を飼う群れ</h1><p>触れた場所に、しばらく月が残る</p></div>
<div class="badge" id="state">静かな夜</div><div class="hint">ドラッグ：月を導く　｜　タップ：星を放つ</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),state=document.getElementById('state');
let W,H,DPR,moon={x:0,y:0,active:false,charge:0},last=0,flock=[],sparks=[],audio=null;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);if(!moon.active){moon.x=W/2;moon.y=H/2}}
addEventListener('resize',resize);resize();
function make(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,size:1.5+Math.random()*2,hue:185+Math.random()*75,phase:Math.random()*7}}
for(let i=0;i<115;i++)flock.push(make());
function wake(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();}
function ping(x,y){wake();if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=170+(x/W)*500+(1-y/H)*220;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.055,audio.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.35);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.4)}
function burst(x,y){for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,s=.5+Math.random()*3;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,h:180+Math.random()*100})}ping(x,y)}
let pointer=false;
function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{pointer=true;canvas.setPointerCapture(e.pointerId);let p=pos(e);moon.x=p.x;moon.y=p.y;moon.active=true;moon.charge=1;burst(p.x,p.y)});
canvas.addEventListener('pointermove',e=>{if(!pointer)return;let p=pos(e);moon.x=p.x;moon.y=p.y;moon.charge=Math.min(1,moon.charge+.025);if(Math.random()<.18)burst(p.x,p.y)});
canvas.addEventListener('pointerup',()=>{pointer=false});canvas.addEventListener('pointercancel',()=>pointer=false);
function frame(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;ctx.fillStyle='rgba(7,9,20,.22)';ctx.fillRect(0,0,W,H);
let near=0;
for(let i=0;i<flock.length;i++){let a=flock[i],ax=0,ay=0,co=0;for(let j=0;j<flock.length;j++){if(i===j)continue;let b=flock[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2<2700){let d=Math.sqrt(d2)||1;ax+=b.vx;ay+=b.vy;co++;if(d<30){ax-=dx/d*1.7;ay-=dy/d*1.7}}}if(co){a.vx+=(ax/co-a.vx)*.012;a.vy+=(ay/co-a.vy)*.012}if(moon.active){let dx=moon.x-a.x,dy=moon.y-a.y,d=Math.hypot(dx,dy)||1;if(d<260){near++;let force=(d<75?-0.055:0.018)*moon.charge;a.vx+=dx/d*force*dt;a.vy+=dy/d*force*dt}}a.vx*=.993;a.vy*=.993;let sp=Math.hypot(a.vx,a.vy);if(sp<.35){a.vx+=Math.cos(a.phase+t*.001)*.015;a.vy+=Math.sin(a.phase+t*.001)*.015}if(sp>2.5){a.vx=a.vx/sp*2.5;a.vy=a.vy/sp*2.5}a.x=(a.x+a.vx*dt+W)%W;a.y=(a.y+a.vy*dt+H)%H;let ang=Math.atan2(a.vy,a.vx),len=7+sp*3;ctx.save();ctx.translate(a.x,a.y);ctx.rotate(ang);ctx.fillStyle=`hsla(${a.hue},90%,75%,.82)`;ctx.beginPath();ctx.moveTo(len,0);ctx.lineTo(-len*.7,3);ctx.lineTo(-len*.35,0);ctx.lineTo(-len*.7,-3);ctx.closePath();ctx.fill();ctx.restore()}
for(let s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.97;s.vy*=.97;s.life-=.025*dt;ctx.fillStyle=`hsla(${s.h},90%,75%,${s.life})`;ctx.fillRect(s.x,s.y,2,2)}sparks=sparks.filter(s=>s.life>0);
if(moon.active){let r=24+Math.sin(t*.004)*3+moon.charge*10,g=ctx.createRadialGradient(moon.x,moon.y,1,moon.x,moon.y,r*3);g.addColorStop(0,'#fff');g.addColorStop(.12,'#b9f5ff');g.addColorStop(.35,'#4bd8e955');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(moon.x,moon.y,r*3,0,7);ctx.fill();ctx.strokeStyle='#c7faff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(moon.x,moon.y,r,0,7);ctx.stroke()}state.textContent=near>24?'群れが月を囲んでいる':near>5?'月を見つけた':'静かな夜';requestAnimationFrame(frame)}
ctx.fillStyle='#070914';ctx.fillRect(0,0,W,H);requestAnimationFrame(frame);
</script>
</body>
</html>
