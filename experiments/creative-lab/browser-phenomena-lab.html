<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser Phenomena Lab</title><style>
@property --heat{syntax:"<number>";inherits:true;initial-value:0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090d;color:#e8e8e3;font-family:ui-monospace,monospace}body{padding:24px}h1{font-size:clamp(18px,3vw,34px);font-weight:500;margin:0}.lead{color:#9699a4;max-width:72ch;line-height:1.7;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin-top:22px}.lab{border:1px solid #292c36;border-radius:18px;padding:16px;background:#101219;overflow:hidden}.lab h2{font-size:13px;font-weight:500;margin:0 0 4px}.meta{font-size:10px;color:#777d8e;margin-bottom:14px}.stage{height:270px;display:grid;place-items:center;border-radius:12px;background:radial-gradient(circle,#171b25,#090a0f);overflow:hidden;position:relative}.shell{display:inline-grid;place-items:center;padding:4px;max-width:94%;transition:padding .16s}.sensor{container-type:inline-size;container-name:sensor;width:var(--w,150px);height:150px;display:grid;place-items:center;border:1px solid #41485b;border-radius:50%;transition:width .13s cubic-bezier(.2,.8,.3,1);background:rgb(calc(12 + var(--heat)*18) calc(14 + var(--heat)*5) calc(20 + var(--heat)*24))}.organ{width:42%;aspect-ratio:1;border-radius:40%;background:#85ffd1;box-shadow:0 0 30px #5effbd66;transition:width .11s,transform .17s;border:1px solid #dffff4}.lab[data-mode="invert"] .organ{background:#a98cff;box-shadow:0 0 30px #8b64ff66}@container sensor (width > 165px){.organ{width:86%;transform:rotate(45deg)}}@container sensor (width > 205px){.organ{width:22%;transform:rotate(135deg);border-radius:50%}}
.controls{display:flex;gap:7px;margin-top:12px}.controls button{border:1px solid #343947;background:#151822;color:#dadddf;border-radius:99px;padding:7px 10px;font:10px ui-monospace;cursor:pointer}.read{height:54px;margin-top:10px;font-size:10px;color:#9ca2b2;line-height:1.5}.trace{position:absolute;inset:auto 8px 8px;height:46px;width:calc(100% - 16px);opacity:.75}.note{margin-top:20px;border-left:2px solid #78ffd0;padding:10px 14px;color:#aeb2bd;font-size:11px;line-height:1.7}
</style></head><body><h1>境界生物：レイアウト相転移の実験</h1><p class="lead">作品ではなく実験装置。コンテナクエリが引いた境界を、外乱、遅延、履歴で横切らせる。JSは形を描かず、揺らし、測るだけ。</p><div class="grid" id="grid"></div><div class="note">観測メモ：直接の自己循環は containment が切断する。そこで「外乱 → サイズ → CSS閾値 → 見た目」という切断面を保存したまま、履歴を次の外乱へ戻す。ブラウザが防ぐ循環と、こちらが媒介して復活させた循環の境界を観る。</div><script>
const specs=[['臨界往復','閾値の両側を微小に往復する',.52,1],['遅延共鳴','過去の大きさが次の外乱になる',.91,-1],['履歴依存','同じ幅でも直前の方向で次が変わる',1.13,1]];
const grid=document.querySelector('#grid');
specs.forEach((s,i)=>{grid.insertAdjacentHTML('beforeend',`<section class="lab" data-i="${i}" data-mode="${i==1?'invert':''}"><h2>${s[0]}</h2><div class="meta">${s[1]}</div><div class="stage"><div class="shell"><div class="sensor"><div class="organ"></div></div></div><canvas class="trace"></canvas></div><div class="controls"><button class="kick">外乱</button><button class="run">自走</button><button class="reset">静止</button></div><div class="read"></div></section>`)});
for(const lab of document.querySelectorAll('.lab')){
 const i=+lab.dataset.i,sensor=lab.querySelector('.sensor'),cv=lab.querySelector('canvas'),ctx=cv.getContext('2d'),read=lab.querySelector('.read'); let w=150,run=false,dir=1,history=[],lastZone=0,cross=0,energy=0,timer;
 function sizeCanvas(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio}sizeCanvas();
 function tick(){if(!run)return;let old=w;if(i===0){w+=dir*2.3;if(w>177||w<154)dir*=-1}else if(i===1){let delayed=history.at(-18)||w;w=170+(delayed-170)*-.96+Math.sin(performance.now()/190)*2}else{let zone=w>165?1:0;if(zone!==lastZone){dir*=zone?-.82:-1.18;lastZone=zone;cross++}w+=dir*1.65;if(w>224){w=224;dir=-1}if(w<128){w=128;dir=1}}
 w=Math.max(110,Math.min(235,w));energy=.92*energy+.08*Math.abs(w-old);history.push(w);if(history.length>150)history.shift();sensor.style.setProperty('--w',w+'px');sensor.style.setProperty('--heat',Math.min(1,energy/2.5));draw();timer=requestAnimationFrame(tick)}
 function draw(){const d=devicePixelRatio,W=cv.width,H=cv.height;ctx.fillStyle='#0a0c12';ctx.fillRect(0,0,W,H);ctx.strokeStyle=i===1?'#a98cff':'#78ffd0';ctx.lineWidth=d;ctx.beginPath();history.forEach((v,n)=>{let x=n/(149)*W,y=H-(v-110)/125*H;n?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();let zone=w>205?2:w>165?1:0;read.textContent=`幅 ${w.toFixed(1)}px / 相 ${zone} / 境界通過 ${cross} / 運動量 ${energy.toFixed(2)}
履歴 ${history.length} samples`;}
 lab.querySelector('.kick').onclick=()=>{w+=Math.random()*70-35;history.push(w);sensor.style.setProperty('--w',w+'px');draw()};lab.querySelector('.run').onclick=()=>{if(!run){run=true;tick()}};lab.querySelector('.reset').onclick=()=>{run=false;cancelAnimationFrame(timer);w=150;dir=1;history=[];cross=0;energy=0;sensor.style.setProperty('--w','150px');draw()};draw();
}
addEventListener('resize',()=>location.reload());
</script></body></html>
