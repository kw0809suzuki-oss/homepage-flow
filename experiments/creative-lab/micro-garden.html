<!DOCTYPE html><html lang='ja'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>ミクロ庭園</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b;color:#d9f8e8;font-family:system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center}main{width:min(100vw,620px);height:100vh;display:flex;flex-direction:column;padding:14px 14px 18px;gap:10px}header{display:flex;justify-content:space-between;align-items:end}h1{font-size:20px;letter-spacing:.12em;margin:0;color:#a6ffd0}p{margin:3px 0 0;color:#83a99a;font-size:12px}.stats{font-size:12px;text-align:right;color:#bee9ce}.board{position:relative;flex:1;min-height:0;border:1px solid #1c594a;border-radius:18px;overflow:hidden;background:#06151a;box-shadow:0 0 35px #0b4e3b55,inset 0 0 45px #031016}canvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;left:14px;bottom:12px;color:#8cb9a4;font-size:11px;pointer-events:none}.controls{display:flex;gap:8px}button{flex:1;border:1px solid #28745a;background:#0d3029;color:#baffd8;border-radius:12px;padding:11px;font-weight:700}button:active{background:#1d674d;transform:scale(.98)}.meter{height:7px;background:#102b29;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#35d98b,#e7ff9c);transition:width .2s}</style></head><body><main><header><div><h1>ミクロ庭園</h1><p>星の種に、光をあげよう</p></div><div class='stats'><span id='score'>0</span> 粒子<br><span id='age'>0</span> 周</div></header><div class='meter'><div class='fill' id='fill'></div></div><div class='board'><canvas id='c'></canvas><div class='hint'>画面をタップして栄養を置く　生命は勝手に考える</div></div><div class='controls'><button id='pause'>一時停止</button><button id='seed'>種をまく</button><button id='reset'>夜明けから</button></div></main><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),ageEl=document.getElementById('age'),fill=document.getElementById('fill'),pause=document.getElementById('pause');let W,H,dpr,grid=[],next=[],running=true,age=0,score=0,last=0;const S=5;function resize(){let r=c.getBoundingClientRect();dpr=devicePixelRatio||1;W=Math.max(20,Math.floor(r.width/S));H=Math.max(20,Math.floor(r.height/S));c.width=r.width*dpr;c.height=r.height*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(!grid.length)init();}function init(){grid=Array.from({length:H},()=>Array(W).fill(0));let cx=W/2,cy=H/2;for(let j=-4;j<=4;j++)for(let i=-4;i<=4;i++)if(i*i+j*j<18)grid[Math.floor(cy+j)][Math.floor(cx+i)]=.7+Math.random()*.3;score=0;age=0;}function add(px,py){let r=c.getBoundingClientRect(),gx=Math.floor((px-r.left)/r.width*W),gy=Math.floor((py-r.top)/r.height*H);for(let j=-5;j<=5;j++)for(let i=-5;i<=5;i++){let yy=gy+j,xx=gx+i;if(yy>=0&&yy<H&&xx>=0&&xx<W){let d=Math.hypot(i,j);if(d<6)grid[yy][xx]=Math.min(1,grid[yy][xx]+(1-d/7)*.7)}}}c.addEventListener('pointerdown',e=>{add(e.clientX,e.clientY)});function step(){if(!running)return;let total=0;next=Array.from({length:H},()=>Array(W).fill(0));for(let y=0;y<H;y++)for(let z=0;z<W;z++){let sum=0,n=0;for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++){let yy=(y+j+H)%H,xx=(z+i+W)%W,w=Math.exp(-(i*i+j*j)/3);sum+=grid[yy][xx]*w;n+=w}let a=grid[y][z],v=a+(sum/n-a)*.42;v+=Math.sin((z+age*.03)*.11)*.002;v=Math.max(0,Math.min(1,v));if(v>.12)total+=v;next[y][z]=v}grid=next;score=Math.floor(total*3);age++;scoreEl.textContent=score;ageEl.textContent=age;fill.style.width=Math.min(100,score/Math.max(1,W*H)*360)+'%'}function draw(t){if(t-last>45){step();last=t}let r=c.getBoundingClientRect(),cw=r.width/W,ch=r.height/H;x.clearRect(0,0,r.width,r.height);x.fillStyle='#06151a';x.fillRect(0,0,r.width,r.height);for(let y=0;y<H;y++)for(let z=0;z<W;z++){let v=grid[y][z];if(v>.025){let glow=v*v;x.fillStyle='rgb('+Math.floor(25+80*glow)+','+Math.floor(100+145*glow)+','+Math.floor(105+90*glow)+')';x.fillRect(z*cw,y*ch,cw+1,ch+1)}}requestAnimationFrame(draw)}document.getElementById('seed').onclick=()=>{add(Math.random()*c.clientWidth+c.getBoundingClientRect().left,Math.random()*c.clientHeight+c.getBoundingClientRect().top)};pause.onclick=()=>{running=!running;pause.textContent=running?'一時停止':'再開'};document.getElementById('reset').onclick=init;addEventListener('resize',resize);resize();requestAnimationFrame(draw)})();</script></body></html>
