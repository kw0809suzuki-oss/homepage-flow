<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opportunity World v0</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div>
        <p class="eyebrow">SECOND WORLD / MARKET OBSERVATORY</p>
        <h1>Opportunity World <span>v0</span></h1>
        <p class="lead">案件を並べるのではなく、既存市場の中にある「金は出ているのに供給・競争・解決が薄い場所」を観測する。</p>
      </div>
      <div class="status">sample data / prototype</div>
    </header>
    <section class="metrics" id="metrics"></section>
    <section class="toolbar">
      <button class="active" data-filter="all">すべて</button>
      <button data-filter="high">高Opportunity</button>
      <button data-filter="thin">供給薄</button>
      <button data-filter="rising">需要上昇</button>
    </section>
    <section class="world">
      <div class="panel">
        <div class="panel-head"><h2>市場の歪み</h2><span>click to inspect</span></div>
        <div id="rows" class="rows"></div>
      </div>
      <aside class="panel detail" id="detail"><p class="muted">左の観測対象を選択してください。</p></aside>
    </section>
    <section class="principle">
      <strong>観測単位</strong>
      <p>案件そのものではなく、需要圧 / 供給薄さ / 支払強度 / 継続性 / 実装可能性。ここから「未充足需要」「価格歪み」「参加可能性」のような第二市場を立ち上げる。</p>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
