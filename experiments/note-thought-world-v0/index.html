<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>note 思考世界観測所 v0</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="wrap">
<header class="hero">
  <div>
    <p class="eyebrow">公開された思考の軌跡を観測する</p>
    <h1>note 思考世界観測所 <span>v0.3</span></h1>
    <p class="lead">note上で公開されている「個人OS」「AIとの自己観測」「人格・記憶」「独自理論」などを、人ではなく思考の軌跡として並べる。</p>
  </div>
  <div class="status">公開記事のみ</div>
</header>
<section class="metrics" id="metrics"></section>
<section class="motifs panel">
  <div class="panel-head"><h2>再出現するテーマ</h2><span>複数の書き手に現れる概念</span></div>
  <div id="motifs" class="motif-grid"></div>
</section>
<section class="toolbar" id="filters"></section>
<section class="world">
  <div class="panel">
    <div class="panel-head"><h2>思考世界</h2><span>タップして観測</span></div>
    <div id="rows" class="rows"></div>
  </div>
  <div id="detailBackdrop" class="detail-backdrop" aria-hidden="true"></div>
  <aside class="panel detail" id="detail"><p class="muted">左のカードを選択してください。</p></aside>
</section>
<section class="principle">
  <strong>境界</strong>
  <p>このページは、公開記事に書かれた内容・用語・時系列を整理する観測用ページです。記事に現れた概念と、その変化だけを扱います。</p>
</section>
</main>
<script src="./script.js"></script>
</body>
</html>
