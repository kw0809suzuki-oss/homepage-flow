name: Execution OS Handoff

on:
  push:
    branches:
      - direction-gate-v0

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Test direction observer control
        run: |
          node --experimental-default-type=module --test direction-gate/connection-control.test.mjs
          node --check api/direction-check.js
          node --check api/openai-approval-execute-probe.js

      - name: Emit execution facts and re-observe reality
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-default-type=module scripts/execution-os-github-handoff.mjs
