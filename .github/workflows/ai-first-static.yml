name: AI-first static integrity
on:
  push:
    branches: [ai-first-redesign-v01]
  pull_request:
    paths:
      - 'index.html'
      - 'workshop/**'
      - 'legacy/**'
      - 'ai*.json'
      - 'ai*.txt'
      - 'FLOW_WORLD_STATE.json'
      - 'tools/**'
      - 'site.css'
      - 'assets/**'
      - 'tests/verify-ai-first.mjs'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node tests/verify-ai-first.mjs
      - run: node tests/verify-entry-trail.mjs
